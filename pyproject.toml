[project]
name = "autopr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sherby", email = "109462679+sherbinator@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docker>=7.2.0",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.1",
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[project.scripts]
autopr = "autopr:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

